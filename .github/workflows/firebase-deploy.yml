name: Firebase Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          # Pinned to 15.33.0: this action shells out to an UNPINNED npx
          # firebase-tools (resolves latest), and 15.34.0+ added a serviceusage
          # precheck to the hosting deploy path (ensureApiEnabled on
          # firebasehosting.googleapis.com). The service account lacks
          # serviceusage.services.get, so deploys fail with 403 "Permission
          # denied to get service". 15.33.0 is the last version proven green in
          # this pipeline (run 37747566593). Unpin once the SA is granted
          # roles/serviceusage.serviceUsageViewer.
          firebaseToolsVersion: '15.33.0'
          projectId: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
