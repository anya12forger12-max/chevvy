# Local/production Compose deployment for the Chevvy web app.
# Copy .env.example to .env and fill in the Firebase values before building.
# The site is available on http://localhost:${HOST_PORT:-8080} (default 8080).
services:
  web:
    image: ${CHEVVY_IMAGE:-chevvy:latest}
    build:
      context: .
      dockerfile: Dockerfile
      # Vite bakes VITE_* values into the bundle at build time. Compose reads
      # these from .env in the project directory; no secrets are stored here.
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
    env_file:
      - .env
    ports:
      - "${HOST_PORT:-8080}:80"
    restart: unless-stopped
