# nginx configuration for the Chevvy static SPA image.
# Copied to /etc/nginx/nginx.conf in the runtime stage.

worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml;
    server_tokens off;

    # Hashed Vite assets are immutable; everything else (including
    # index.html and client-side routes) must be revalidated.
    map $uri $chevvy_cache_control {
        default              "no-cache, no-store, must-revalidate";
        ~^/assets/           "public, max-age=31536000, immutable";
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        add_header Cache-Control $chevvy_cache_control always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # SPA history fallback: unknown paths are handled by the React router.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # A missing hashed asset should be a real 404, not index.html.
        location /assets/ {
            try_files $uri =404;
        }
    }
}
